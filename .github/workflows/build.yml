name: 构建 iOS 安装包

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  APP_NAME: NewWeb
  SCHEME: Runner
  FLUTTER_VERSION: '3.47.2'
  BUNDLE_ID: com.newweb.newweb

jobs:
  build:
    name: 构建安装包
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 第一步：检测是否配置了签名证书
      # ------------------------------------------------------------
      - name: 检测签名证书
        id: detect
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        run: |
          if [ -n "$IOS_CERTIFICATE" ]; then
            echo "has_cert=true" >> $GITHUB_OUTPUT
            echo "检测到签名证书，将使用签名模式构建"
          else
            echo "has_cert=false" >> $GITHUB_OUTPUT
            echo "未检测到签名证书，将使用无签名模式构建"
          fi

      - name: 安装 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 查看 Flutter 版本
        run: flutter --version

      - name: 安装依赖
        run: |
          flutter pub get
          cd ios && pod install --repo-update || pod install

      # ============================================================
      # 签名模式：安装证书与描述文件
      # ============================================================
      - name: 安装 Apple 签名证书
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PWD: ${{ secrets.IOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          echo "$IOS_CERTIFICATE" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      - name: 安装描述文件
        if: steps.detect.outputs.has_cert == 'true'
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE" | base64 -d > profile.mobileprovision
          security cms -D -i profile.mobileprovision -o profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          # 提取 entitlements 供 codesign 使用
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" profile.plist > entitlements.plist
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist)
          echo "描述文件 UUID: $UUID"
          echo "团队 ID: $TEAM_ID"
          rm -f profile.mobileprovision profile.plist

      # ============================================================
      # 编译（两种模式共用：先无签名编译）
      # ============================================================
      - name: 编译应用
        run: |
          # 强制无签名构建
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          # Flutter 后处理可能因签名检查报错，但 Xcode 实际已构建成功
          flutter build ios --release --no-codesign || true
          # 验证 Runner.app 是否生成
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "::error::未找到 Runner.app，构建失败"
            exit 1
          fi
          echo "构建成功，Runner.app 已生成"

      - name: 正式签名（签名模式）
        if: steps.detect.outputs.has_cert == 'true'
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到应用 $APP_PATH"
            exit 1
          fi
          chmod +x "$APP_PATH/Runner"
          cp entitlements.plist "$APP_PATH/entitlements.plist"
          cp ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision "$APP_PATH/embedded.mobileprovision"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -o 'iPhone [^"]*' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::钥匙串中未找到 iPhone 签名身份"
            exit 1
          fi
          echo "使用签名身份: $IDENTITY"
          codesign --force --sign "$IDENTITY" --entitlements "$APP_PATH/entitlements.plist" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" || true
          rm -f "$APP_PATH/entitlements.plist"

      - name: 临时签名（无签名模式）
        if: steps.detect.outputs.has_cert == 'false'
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到应用 $APP_PATH"
            exit 1
          fi
          chmod +x "$APP_PATH/Runner"
          codesign --force --sign - --generate-entitlement-der "$APP_PATH" 2>&1 || true
          echo "=== _CodeSignature ==="
          ls -la "$APP_PATH/_CodeSignature/" 2>/dev/null || echo "无 _CodeSignature"

      - name: 打包 IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到应用 $APP_PATH"
            ls -la build/ios/iphoneos/ || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "${APP_NAME}.ipa" Payload
          rm -rf Payload
          ls -lh "${APP_NAME}.ipa"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.detect.outputs.has_cert == 'true' && 'signed' || 'unsigned' }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 90

      # ------------------------------------------------------------
      # 自动创建 GitHub Release 并上传 IPA（供 App 内检查更新下载）
      # ------------------------------------------------------------
      - name: 读取版本号
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本号: v$VER"

      - name: 创建 Release 并上传 IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 未来浏览器 v${{ steps.version.outputs.version }}
          body: |
            ## 未来浏览器 v${{ steps.version.outputs.version }}

            自动构建发布。请查看仓库 README.md 获取详细更新日志。

            **安装方式**：下载下方 IPA 文件后，用全能签 / TrollStore / Sideloadly 等工具签名安装。
          files: ${{ env.APP_NAME }}.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
